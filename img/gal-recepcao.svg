<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ilustração da recepção da academia com balcão, emblema na parede e área de espera">
  <title>Recepção (imagem ilustrativa)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d25"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="vermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3247"/>
      <stop offset="100%" stop-color="#c00e22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- emblema na parede -->
  <g transform="translate(400 220) rotate(-6)">
    <rect x="-150" y="-70" width="300" height="140" rx="14" fill="#101218" stroke="#2c303a" stroke-width="5"/>
    <g transform="translate(-84 0) rotate(-8) skewX(-8)">
      <rect x="-10" y="-38" width="20" height="76" rx="4" fill="#f8f8fa" transform="rotate(45)"/>
      <rect x="-10" y="-38" width="20" height="76" rx="4" fill="#e5142b" transform="rotate(-45)"/>
    </g>
    <text x="40" y="-2" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif"
          font-size="44" fill="#f8f8fa" letter-spacing="2" transform="skewX(-8)">TREME</text>
    <text x="46" y="44" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif"
          font-size="34" fill="#ff3247" letter-spacing="10" transform="skewX(-8)">FIT</text>
  </g>

  <!-- faixa na parede -->
  <g transform="rotate(-12 400 360)">
    <rect x="-60" y="352" width="920" height="20" fill="url(#vermelho)" opacity=".7"/>
    <rect x="-60" y="380" width="920" height="6" fill="#f8f8fa" opacity=".4"/>
  </g>

  <!-- piso -->
  <rect y="620" width="800" height="180" fill="#090a0d"/>
  <rect y="620" width="800" height="6" fill="#23262e"/>

  <!-- balcão -->
  <g>
    <rect x="180" y="470" width="440" height="150" rx="12" fill="#2c303a"/>
    <rect x="180" y="470" width="440" height="14" rx="7" fill="#e5142b"/>
    <rect x="210" y="510" width="120" height="70" rx="8" fill="#0d0e12"/>
    <rect x="218" y="518" width="104" height="54" rx="5" fill="#14161b" stroke="#3a3f4b" stroke-width="3"/>
    <rect x="380" y="520" width="180" height="14" rx="6" fill="#3a3f4b"/>
    <rect x="380" y="548" width="140" height="14" rx="6" fill="#3a3f4b"/>
  </g>

  <!-- recepcionista -->
  <g fill="#05060a">
    <circle cx="300" cy="400" r="28"/>
    <path d="M276 436h48l16 40h-80z"/>
  </g>

  <!-- planta -->
  <g>
    <rect x="676" y="560" width="52" height="60" rx="8" fill="#2c303a"/>
    <path d="M702 560c-30-10-36-52-10-74 8 26 20 30 10 74z" fill="#2f6b46"/>
    <path d="M702 560c26-16 22-52-2-70-2 26-12 34 2 70z" fill="#3c8a5b"/>
  </g>
</svg>
