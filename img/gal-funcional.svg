<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ilustração da área funcional com kettlebells, cordas e cones">
  <title>Área funcional (imagem ilustrativa)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191c24"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="vermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3247"/>
      <stop offset="100%" stop-color="#c00e22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <g transform="rotate(-14 400 220)">
    <rect x="-80" y="210" width="960" height="24" fill="url(#vermelho)" opacity=".8"/>
    <rect x="-80" y="244" width="960" height="8" fill="#f8f8fa" opacity=".5"/>
  </g>

  <rect y="600" width="800" height="200" fill="#090a0d"/>
  <rect y="600" width="800" height="6" fill="#23262e"/>

  <!-- aluno com kettlebell (silhueta) -->
  <g fill="#05060a">
    <circle cx="330" cy="300" r="34"/>
    <path d="M300 342h60l24 120-38 6-16-64-16 64-38-6z"/>
    <path d="M300 348l-42 62 20 18 48-46z"/>
    <path d="M360 348l42 62-20 18-48-46z"/>
    <path d="M304 468l-10 128h38l8-92 8 92h38l-10-128z"/>
  </g>
  <!-- kettlebell -->
  <g>
    <path d="M386 428c0-16 12-28 28-28s28 12 28 28" fill="none" stroke="#cfd2d8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="414" cy="470" r="34" fill="#2c303a" stroke="#e5142b" stroke-width="7"/>
  </g>

  <!-- corda naval -->
  <g fill="none" stroke="#3a3f4b" stroke-width="16" stroke-linecap="round">
    <path d="M560 560c40-60 90-40 130-90s90-30 110 10"/>
    <path d="M560 590c40-40 100-20 140-70s80-20 100 20"/>
  </g>
  <circle cx="560" cy="575" r="18" fill="#2c303a"/>

  <!-- cones -->
  <g>
    <path d="M120 600l24-64 24 64z" fill="#e5142b"/>
    <rect x="104" y="600" width="80" height="10" rx="4" fill="#c00e22"/>
    <path d="M210 600l18-48 18 48z" fill="#f8f8fa" opacity=".9"/>
    <rect x="198" y="600" width="60" height="8" rx="4" fill="#cfd2d8" opacity=".7"/>
  </g>

  <!-- caixa pliométrica -->
  <g>
    <rect x="580" y="470" width="140" height="130" rx="10" fill="#2c303a"/>
    <rect x="580" y="470" width="140" height="12" rx="6" fill="#e5142b"/>
    <text x="650" y="552" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif"
          font-size="44" fill="#3a3f4b" transform="skewX(-8)">01</text>
  </g>
</svg>
