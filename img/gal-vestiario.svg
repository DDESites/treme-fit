<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ilustração dos vestiários com armários e bancada">
  <title>Vestiários (imagem ilustrativa)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d25"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="vermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3247"/>
      <stop offset="100%" stop-color="#c00e22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <g transform="rotate(-14 400 220)">
    <rect x="-80" y="210" width="960" height="24" fill="url(#vermelho)" opacity=".8"/>
    <rect x="-80" y="244" width="960" height="8" fill="#f8f8fa" opacity=".5"/>
  </g>

  <rect y="640" width="800" height="160" fill="#090a0d"/>
  <rect y="640" width="800" height="6" fill="#23262e"/>

  <!-- armários -->
  <g>
    <g fill="#22252d" stroke="#3a3f4b" stroke-width="4">
      <rect x="120" y="300" width="100" height="340" rx="8"/>
      <rect x="230" y="300" width="100" height="340" rx="8"/>
      <rect x="340" y="300" width="100" height="340" rx="8"/>
      <rect x="450" y="300" width="100" height="340" rx="8"/>
      <rect x="560" y="300" width="100" height="340" rx="8"/>
    </g>
    <!-- alças e detalhes vermelhos -->
    <g fill="#e5142b">
      <rect x="200" y="460" width="10" height="40" rx="5"/>
      <rect x="310" y="460" width="10" height="40" rx="5"/>
      <rect x="420" y="460" width="10" height="40" rx="5"/>
      <rect x="530" y="460" width="10" height="40" rx="5"/>
      <rect x="640" y="460" width="10" height="40" rx="5"/>
    </g>
    <g fill="#3a3f4b">
      <rect x="140" y="330" width="60" height="8" rx="4"/>
      <rect x="250" y="330" width="60" height="8" rx="4"/>
      <rect x="360" y="330" width="60" height="8" rx="4"/>
      <rect x="470" y="330" width="60" height="8" rx="4"/>
      <rect x="580" y="330" width="60" height="8" rx="4"/>
      <rect x="140" y="592" width="60" height="8" rx="4"/>
      <rect x="250" y="592" width="60" height="8" rx="4"/>
      <rect x="360" y="592" width="60" height="8" rx="4"/>
      <rect x="470" y="592" width="60" height="8" rx="4"/>
      <rect x="580" y="592" width="60" height="8" rx="4"/>
    </g>
  </g>

  <!-- toalha pendurada -->
  <g>
    <rect x="686" y="360" width="70" height="150" rx="8" fill="#f8f8fa" opacity=".9"/>
    <rect x="686" y="360" width="70" height="22" rx="8" fill="#e5142b"/>
  </g>

  <!-- banco -->
  <g>
    <rect x="150" y="700" width="500" height="24" rx="10" fill="#2c303a"/>
    <rect x="150" y="700" width="500" height="8" rx="4" fill="#e5142b" opacity=".8"/>
    <rect x="180" y="724" width="16" height="40" fill="#3a3f4b"/>
    <rect x="604" y="724" width="16" height="40" fill="#3a3f4b"/>
  </g>
</svg>
