<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Imagem de compartilhamento da TREME FIT com emblema e frase Seu próximo nível começa aqui">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1e26"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="vermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3247"/>
      <stop offset="100%" stop-color="#c00e22"/>
    </linearGradient>
    <pattern id="listras" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <rect width="30" height="30" fill="none"/>
      <rect width="8" height="30" fill="#ffffff" opacity=".03"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#listras)"/>

  <!-- faixa diagonal -->
  <g transform="rotate(-14 600 500)">
    <rect x="-100" y="490" width="1500" height="30" fill="url(#vermelho)"/>
    <rect x="-100" y="530" width="1500" height="10" fill="#f8f8fa" opacity=".7"/>
  </g>

  <!-- emblema X -->
  <g transform="translate(190 250) rotate(-8)">
    <g transform="rotate(-8) skewX(-8)">
      <rect x="-34" y="-110" width="68" height="220" rx="8" fill="#f8f8fa" transform="rotate(45)"/>
      <rect x="-34" y="-110" width="68" height="220" rx="8" fill="url(#vermelho)" transform="rotate(-45)"/>
    </g>
  </g>

  <!-- letreiro -->
  <g transform="translate(380 0) skewX(-8)">
    <text x="30" y="230" font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
          font-size="130" fill="#f8f8fa" letter-spacing="4">TREME</text>
    <text x="36" y="360" font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
          font-size="120" fill="#ff3247" letter-spacing="26">FIT</text>
  </g>

  <text x="392" y="440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="700" fill="#b8bcc6">Seu próximo nível começa aqui.</text>
</svg>
