<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-label="Ilustração do salão de treino da TREME FIT com alunos e equipe em atividade sob luz forte">
  <title>TREME FIT — salão de treino (imagem ilustrativa)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1f27"/>
      <stop offset="60%" stop-color="#101218"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowVermelho" cx="0.85" cy="0.75" r="0.6">
      <stop offset="0%" stop-color="#e5142b" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#e5142b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3247"/>
      <stop offset="100%" stop-color="#c00e22"/>
    </linearGradient>
    <pattern id="listras" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <rect width="34" height="34" fill="none"/>
      <rect width="9" height="34" fill="#ffffff" opacity=".03"/>
    </pattern>
  </defs>

  <rect width="1100" height="900" fill="url(#bg)"/>
  <rect width="1100" height="900" fill="url(#listras)"/>
  <rect width="1100" height="900" fill="url(#luz)"/>
  <rect width="1100" height="900" fill="url(#glowVermelho)"/>

  <!-- luzes de teto -->
  <g fill="#f8f8fa" opacity=".22">
    <rect x="120" y="60" width="220" height="12" rx="6"/>
    <rect x="440" y="60" width="220" height="12" rx="6"/>
    <rect x="760" y="60" width="220" height="12" rx="6"/>
  </g>

  <!-- parede com faixa vermelha diagonal -->
  <g transform="rotate(-12 550 300)">
    <rect x="-100" y="330" width="1300" height="34" fill="url(#vermelho)" opacity=".85"/>
    <rect x="-100" y="374" width="1300" height="10" fill="#f8f8fa" opacity=".55"/>
  </g>

  <!-- piso -->
  <rect y="700" width="1100" height="200" fill="#0a0b0e"/>
  <rect y="700" width="1100" height="8" fill="#23262e"/>

  <!-- rack de halteres ao fundo -->
  <g stroke="#3a3f4b" stroke-width="10" stroke-linecap="round">
    <path d="M120 560h240"/>
    <path d="M120 640h240"/>
  </g>
  <g fill="#2c303a">
    <rect x="140" y="524" width="34" height="34" rx="8"/>
    <rect x="196" y="524" width="34" height="34" rx="8"/>
    <rect x="252" y="524" width="34" height="34" rx="8"/>
    <rect x="308" y="524" width="34" height="34" rx="8"/>
    <rect x="140" y="604" width="34" height="34" rx="8"/>
    <rect x="196" y="604" width="34" height="34" rx="8"/>
    <rect x="252" y="604" width="34" height="34" rx="8"/>
    <rect x="308" y="604" width="34" height="34" rx="8"/>
  </g>
  <g fill="#e5142b" opacity=".9">
    <rect x="140" y="524" width="10" height="34" rx="4"/>
    <rect x="196" y="524" width="10" height="34" rx="4"/>
    <rect x="252" y="524" width="10" height="34" rx="4"/>
    <rect x="308" y="524" width="10" height="34" rx="4"/>
  </g>

  <!-- esteiras -->
  <g>
    <rect x="820" y="520" width="200" height="30" rx="8" fill="#2c303a" transform="skewX(-8)"/>
    <rect x="840" y="430" width="26" height="96" rx="8" fill="#3a3f4b" transform="skewX(-8)"/>
    <rect x="846" y="436" width="60" height="42" rx="8" fill="#0d0e12" stroke="#e5142b" stroke-width="4" transform="skewX(-8)"/>
  </g>

  <!-- aluno 1: levantamento com barra (silhueta) -->
  <g fill="#05060a">
    <!-- barra -->
    <rect x="330" y="330" width="300" height="14" rx="7"/>
    <circle cx="345" cy="337" r="42"/>
    <circle cx="615" cy="337" r="42"/>
    <circle cx="345" cy="337" r="42" fill="none" stroke="#e5142b" stroke-width="7"/>
    <circle cx="615" cy="337" r="42" fill="none" stroke="#e5142b" stroke-width="7"/>
    <!-- corpo -->
    <circle cx="480" cy="410" r="34"/>
    <path d="M452 448h56l26 130-40 6-14-72-14 72-40-6z"/>
    <path d="M452 452l-64 46 16 26 72-40z"/>
    <path d="M508 452l64 46-16 26-72-40z"/>
    <path d="M448 580l-10 122h40l8-96 8 96h40l-10-122z"/>
  </g>

  <!-- aluno 2: corrida esteira (silhueta menor, ao fundo) -->
  <g fill="#05060a" opacity=".85">
    <circle cx="905" cy="420" r="24"/>
    <path d="M888 448h34l14 78-26 4-8-44-8 44-26-4z"/>
    <path d="M888 452l-30 30 12 18 34-24z"/>
    <path d="M922 452l30 30-12 18-34-24z"/>
    <path d="M892 530l-18 60h26l10-40 8 40h26l-14-60z"/>
  </g>

  <!-- treinador com prancheta -->
  <g fill="#05060a">
    <circle cx="200" cy="430" r="28"/>
    <path d="M176 466h48l18 96-30 5-12-52-12 52-30-5z"/>
    <path d="M176 470l-34 40 14 18 40-30z"/>
    <rect x="128" y="498" width="46" height="34" rx="5" fill="#2c303a" stroke="#e5142b" stroke-width="4"/>
    <path d="M182 568l-10 56h28l6-36 6 36h28l-10-56z"/>
  </g>

  <!-- grafismo X ao fundo -->
  <g transform="translate(700 240) rotate(-8)" opacity=".14">
    <rect x="-22" y="-90" width="44" height="180" rx="6" fill="#f8f8fa" transform="rotate(45)"/>
    <rect x="-22" y="-90" width="44" height="180" rx="6" fill="#e5142b" transform="rotate(-45)"/>
  </g>

  <!-- brilho de chão -->
  <ellipse cx="550" cy="706" rx="420" ry="16" fill="#ffffff" opacity=".05"/>
</svg>
